name: 点呼

on:
  schedule:
    # 毎日 22:10 UTC = 日本時間 朝 7:10
    - cron: "10 22 * * *"
  workflow_dispatch: # 手動でも押せる
  push:
    # default ブランチ。名前を変えたらここも直すこと
    branches: [main]
    paths:
      - "scripts/tenko.mjs"
      - ".github/workflows/tenko.yml"

permissions:
  contents: write

concurrency:
  group: tenko
  cancel-in-progress: false

jobs:
  dive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 潜って確認する
        run: node scripts/tenko.mjs

      - name: 結果を持ち帰る
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/status.json; then
            echo "変化なし。海は凪いでる。"
          else
            git add docs/status.json
            git commit -m "点呼: $(date -u +%Y-%m-%d)"
            git push
          fi
