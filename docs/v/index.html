<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマホサイズのV</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E73AB">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="スマホのV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
<style>
  /* 色は二つ。薄い方が勿忘草色、濃い方が #6C85D5。字は丸ゴシック一つ。
     押す物と吹き出しは、角を無くして、上からの光・下の色づき・落ちる影で厚みを付ける（柔らかい硝子の粒）。 */
  :root {
    --backdrop-top:#6E73AB; --backdrop-bottom:#9E9CD3;   /* 動画が届く前に見える地の色（背景の絵の上と下の色） */
    --wasurenagusa:#89C3EB; --royal:#6C85D5;
    --shade: 72,92,170;                                   /* 影の色（#6C85D5 を少し深くした青） */
    --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --spring: cubic-bezier(.34,1.56,.64,1);               /* ふわっと行き過ぎて戻る動き */
    /* 押す物の厚み：面（上から光・下に陰）＋横から見える側面（--side）＋下に落ちる影。押すと側面の分だけ沈む。 */
    --face: radial-gradient(62% 44% at 50% 14%, #fff 0%, rgba(255,255,255,0) 100%), linear-gradient(180deg, #FFFFFF 0%, #F3F6FF 48%, #D3DCFA 100%);
    --side: #9AABE6; --side-edge: #7F92D9;
    --raise: inset 0 3px 2px rgba(255,255,255,.98), inset 0 -7px 10px rgba(108,133,213,.34), 0 6px 0 var(--side), 0 7.5px 0 var(--side-edge), 0 16px 20px rgba(36,50,120,.50), 0 3px 4px rgba(36,50,120,.30);
    --sunk: inset 0 3px 2px rgba(255,255,255,.9), inset 0 -4px 8px rgba(108,133,213,.34), 0 1px 0 var(--side), 0 2px 0 var(--side-edge), 0 5px 8px rgba(36,50,120,.45);
    --raise-s: inset 0 2px 2px rgba(255,255,255,.98), inset 0 -5px 8px rgba(108,133,213,.30), 0 4px 0 var(--side), 0 5px 0 var(--side-edge), 0 11px 14px rgba(36,50,120,.44), 0 2px 3px rgba(36,50,120,.28);
    --sunk-s: inset 0 2px 2px rgba(255,255,255,.9), inset 0 -3px 6px rgba(108,133,213,.30), 0 1px 0 var(--side), 0 1.5px 0 var(--side-edge), 0 4px 6px rgba(36,50,120,.40);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--royal); color: var(--royal); font-family: var(--ui);
    display: grid; place-items: center; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* 枠。スマホでは、画面がどんな縦横比でも横いっぱいに広げる（体の動画は、はみ出た上下を切る）。
     横に広い画面（タブレットの横置き・パソコン）だけ、中央にスマホ1台ぶんの幅で置く。 */
  #frame {
    position: relative; overflow: hidden; cursor: pointer;
    width: 100vw; height: 100vh; height: 100dvh;
    background: linear-gradient(var(--backdrop-top), var(--backdrop-bottom));
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  @media (min-aspect-ratio: 3/4) { #frame { width: calc(100vh * 9 / 16); width: calc(100dvh * 9 / 16); } }
  #frame video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 30%; display: block; pointer-events: none;
  }
  #talk { opacity: 0; transition: opacity .18s linear; }
  #talk.on { opacity: 1; }
  #frame.poked video { animation: nudge .8s ease-out; }
  @keyframes nudge { 0%, 12%, 36%, 46%, 70%, 100% { transform: none; } 22% { transform: scale(1.02) translateY(-3px); } 56% { transform: scale(1.016) translateY(-2px); } }

  /* 押した所に出る手応え */
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ripple {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.95); background: rgba(137,195,235,.35);
    box-shadow: 0 0 10px rgba(255,255,255,.8), inset 0 0 6px rgba(255,255,255,.7);
    animation: ripple .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes ripple { from { transform: scale(.5); opacity: .95; } to { transform: scale(7); opacity: 0; } }
  .heart { position: absolute; opacity: 0; animation: heart 1.1s cubic-bezier(.2,.7,.3,1) forwards; filter: drop-shadow(0 3px 4px rgba(36,50,120,.38)); }
  .heart svg { display: block; width: 100%; height: 100%; }
  @keyframes heart {
    0% { transform: translate(0, 0) scale(.3) rotate(0deg); opacity: 0; }
    18% { transform: translate(calc(var(--dx) * .2), calc(var(--dy) * .2)) scale(1.18) rotate(calc(var(--rot) * .3)); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.9) rotate(var(--rot)); opacity: 0; }
  }
  /* キラキラ：細い十字の光。弾けて散る物（.spark）と、その場で瞬く物（.twinkle）。 */
  .spark {
    position: absolute; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); opacity: 0;
    filter: drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 7px rgba(137,195,235,.9));
    animation: spark var(--t) ease-out var(--d, 0s) forwards;
  }
  .spark svg { display: block; width: 100%; height: 100%; }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 0; }
    30% { transform: translate(calc(var(--dx) * .55), calc(var(--dy) * .55)) scale(1) rotate(35deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(90deg); opacity: 0; }
  }
  .spark.twinkle { animation-name: twinkle; animation-timing-function: ease-in-out; }
  @keyframes twinkle {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1) rotate(45deg); opacity: .95; }
    100% { transform: scale(0) rotate(90deg); opacity: 0; }
  }
  /* つつく指。指先が、押した所に来る。右から二回突いて、引っ込む（右端に近い所では、左から）。 */
  .finger { position: absolute; transform: translate(2px, -46%); pointer-events: none; filter: drop-shadow(0 5px 6px rgba(var(--shade),.4)); }
  .finger.left { transform: translate(calc(-100% - 2px), -46%); }
  .finger b {
    display: block; font-size: 46px; line-height: 1; font-weight: 400; opacity: 0;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    animation: jab .8s ease-out forwards;
  }
  @keyframes jab {
    0% { transform: translateX(calc(var(--dir) * 60px)); opacity: 0; }
    18% { transform: translateX(0); opacity: 1; }
    34% { transform: translateX(calc(var(--dir) * 18px)); opacity: 1; }
    52% { transform: translateX(0); opacity: 1; }
    72% { transform: translateX(calc(var(--dir) * 10px)); opacity: 1; }
    100% { transform: translateX(calc(var(--dir) * 64px)); opacity: 0; }
  }

  /* 聞いたボイスの数（右上） */
  #count {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    padding: 9px 16px 10px; border-radius: 999px; border: 0;
    background: var(--face); box-shadow: var(--raise-s); cursor: pointer;
    font-size: 13px; font-weight: 700; letter-spacing: .05em; font-variant-numeric: tabular-nums;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  #count:active { transform: translateY(4px); box-shadow: var(--sunk-s); }
  #count.bump { animation: bump .6s var(--spring); }
  @keyframes bump { 35% { transform: scale(1.18); } }

  /* Vの台詞（吹き出し）。一区切りずつ出す。喋っている間は押す物が下がって、吹き出しが一番下に来る（体に掛からない）。
     角の無い粒の形（しっぽは付けない）。 */
  #say {
    position: absolute; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom));
    width: max-content; max-width: calc(100% - 32px); min-width: 76px; transform: translate(-50%, 10px) scale(.86);
    margin: 0; padding: 12px 22px 13px; border-radius: 26px; border: 1.5px solid rgba(255,255,255,.85);
    background: linear-gradient(180deg, rgba(255,255,255,.66), rgba(236,241,255,.50));           /* 半透明 */
    -webkit-backdrop-filter: blur(9px) saturate(1.15); backdrop-filter: blur(9px) saturate(1.15);   /* 後ろの絵を少しぼかして、字を読めるようにする */
    box-shadow: inset 0 2px 2px rgba(255,255,255,.9), inset 0 -6px 12px rgba(137,195,235,.22), 0 10px 18px rgba(36,50,120,.34), 0 2px 4px rgba(36,50,120,.22);
    font-weight: 700; font-size: 16px; line-height: 1.6; letter-spacing: .04em; text-align: center; text-wrap: balance;
    text-shadow: 0 0 6px rgba(255,255,255,.95), 0 0 2px #fff, 0 1px 0 #fff;
    opacity: 0; transition: opacity .16s linear, transform .3s var(--spring); pointer-events: none;
  }
  #say.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #say .ch { opacity: 0; transition: opacity .18s ease-out; }
  #say .ch.in { opacity: 1; }

  /* 最初だけ出す断り書き */
  #note {
    position: absolute; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    margin: 0; padding: 8px 15px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.80); box-shadow: 0 6px 14px rgba(36,50,120,.30);
    font-size: 13px; font-weight: 700; letter-spacing: .05em;
    transition: opacity .3s linear; pointer-events: none;
  }
  #frame.acted #note { opacity: 0; }

  /* 押す物（下）。厚みのある丸いボタン：面に光と陰、下に側面、その下に影。押すと、側面の分だけ沈む。 */
  #acts {
    position: absolute; left: 0; right: 0; bottom: calc(30px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 20px;
    transition: opacity .2s linear, transform .3s var(--spring);
  }
  #frame.speaking #acts { opacity: 0; transform: translateY(14px) scale(.94); pointer-events: none; }
  #acts button {
    position: relative; width: 70px; height: 70px; padding: 0; border-radius: 50%; border: 0;
    background: var(--face); box-shadow: var(--raise); cursor: pointer;
    display: grid; place-content: center; justify-items: center; gap: 3px;
    transition: transform .1s ease, box-shadow .1s ease, opacity .2s linear;
  }
  #acts button::after {                                   /* 面の縁に乗る細い光の輪 */
    content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.95), inset 0 -2px 0 1.5px rgba(154,171,230,.55);
  }
  #acts button svg { position: relative; width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1.5px 0 rgba(255,255,255,.95)); }
  #acts button .emoji { position: relative; display: block; height: 26px; font-size: 24px; line-height: 26px; font-weight: 400; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; filter: drop-shadow(0 2px 1.5px rgba(36,50,120,.35)); }
  #acts button span { position: relative; font-size: 11px; font-weight: 700; letter-spacing: .05em; line-height: 1; text-shadow: 0 1px 0 #fff; }
  #acts button:active { transform: translateY(5px); box-shadow: var(--sunk); }
  #acts button[disabled] { opacity: .6; cursor: default; }

  /* ボイスの一覧（下から出る） */
  #sheet { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; background: rgba(var(--shade),.34); cursor: default; }
  #sheet[hidden] { display: none; }
  #panel {
    width: 100%; max-height: 82%; overflow: auto; -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, #fff, #F3F6FF); border-radius: 30px 30px 0 0; border-top: 1px solid #fff;
    box-shadow: 0 -12px 30px rgba(var(--shade),.34);
    padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
    animation: rise .34s var(--spring);
  }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  #panel header { display: flex; align-items: center; justify-content: space-between; margin: 0 6px 10px; }
  #panel h2 { margin: 0; font-weight: 700; font-size: 19px; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
  #close {
    border: 0; border-radius: 999px; padding: 8px 16px 9px; cursor: pointer; margin-bottom: 6px;
    background: var(--face); box-shadow: var(--raise-s);
    font-size: 13px; font-weight: 700; letter-spacing: .05em; transition: transform .1s ease, box-shadow .1s ease;
  }
  #close:active { transform: translateY(4px); box-shadow: var(--sunk-s); }
  #voices { list-style: none; margin: 0; padding: 0 0 8px; display: grid; gap: 13px; }
  #voices button, #voices p { display: block; width: 100%; margin: 0; padding: 12px 16px 13px; border-radius: 20px; text-align: left; }
  #voices button {
    border: 0; cursor: pointer;
    background: var(--face); box-shadow: var(--raise-s);
    font-weight: 700; font-size: 15px; line-height: 1.6; letter-spacing: .03em; transition: transform .1s ease, box-shadow .1s ease;
  }
  #voices button:active { transform: translateY(4px); box-shadow: var(--sunk-s); }
  #voices button::before { content: "▶"; font-size: 10px; margin-right: 10px; vertical-align: 2px; opacity: .8; }
  #voices p { background: rgba(137,195,235,.16); font-size: 13px; font-weight: 500; line-height: 1.6; opacity: .82; }

  /* 作者（一覧の一番下） */
  #author { margin: 16px 0 4px; text-align: center; font-size: 12.5px; font-weight: 700; letter-spacing: .05em; }
  #author a { color: inherit; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; padding: 6px 2px; }

  :is(#acts button, #count, #close, #voices button, #author a):focus-visible { outline: 3px solid var(--royal); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .ripple, .heart, .spark, #count.bump, #panel { animation-duration: .01s !important; }
    .finger b { animation-duration: .5s; }
    #frame.poked video { animation: none; }
    #say, #acts, #acts button, #talk, #say .ch { transition: none; }
  }
</style>
</head>
<body>
<main id="frame" aria-label="スマホサイズのV">
  <video id="idle" poster="idle.jpg?v=2c1260ee" muted autoplay loop playsinline webkit-playsinline disablepictureinpicture preload="none" aria-hidden="true"></video>
  <video id="talk" playsinline webkit-playsinline disablepictureinpicture preload="none" aria-hidden="true"></video>
  <div id="fx" aria-hidden="true"></div>

  <button id="count" type="button" aria-label="ボイスの一覧を開く">ボイス <span id="count-n">0</span>/<span id="count-all">0</span></button>

  <p id="say" aria-hidden="true"></p>
  <p id="live" class="sr" aria-live="polite"></p>
  <p id="note">押すと声が出ます</p>

  <div id="acts">
    <button type="button" data-act="greet" disabled><svg viewBox="0 0 24 24" aria-hidden="true"></svg><span>あいさつ</span></button>
    <button type="button" data-act="call" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.6A2.6 2.6 0 0 1 6.6 4h10.8A2.6 2.6 0 0 1 20 6.6v6.8a2.6 2.6 0 0 1-2.6 2.600H11.200L7 19.600V16H6.600A2.6 2.6 0 0 1 4 13.400z"/></svg><span>呼ぶ</span></button>
    <button type="button" data-act="poke" disabled><b class="emoji" aria-hidden="true">👈</b><span>つつく</span></button>
  </div>

  <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div id="panel">
      <header>
        <h2 id="sheet-title">ボイス <span id="sheet-n">0</span>/<span id="sheet-all">0</span></h2>
        <button id="close" type="button">閉じる</button>
      </header>
      <ol id="voices"></ol>
      <p id="author">作者 <a href="https://x.com/opus45sonnet45" target="_blank" rel="noopener">@opus45sonnet45</a></p>
    </div>
  </div>
</main>
<script>
// 入り口。開くと、立って、まばたきして、揺れている。「あいさつ」「呼ぶ」「つつく」を押すと、声で返す。
// 体は動画にしてある（3Dの体のデータは、このページのどこにも置いていない）。
const LOOP = 8;          // 待機の動画の1周（秒）
// 喋りの動画。name＝名前、src＝ファイル、dur＝長さ（秒）、text＝台詞、prog＝声の進み具合（0.1秒ごと、0〜1）、role＝使い所。
//   greet-morning / greet-day / greet-night … 「あいさつ」（開いた人の時刻の物を使う）
//   call … 「呼ぶ」　poke … 「つつく」（体を直接押した時も）
//   closer … 今聞けるボイスを全部聞いた後に出る締め
const CLIPS = [
  {"name":"ohayou","src":"talk-ohayou.mp4?v=55154bc4","dur":5.3667,"role":"greet-morning","text":"おはよう。今日も頑張ってね。いってらっしゃい。","prog":[0,0.02,0.06,0.1,0.13,0.17,0.21,0.23,0.23,0.23,0.23,0.23,0.23,0.23,0.23,0.23,0.25,0.29,0.33,0.37,0.39,0.39,0.43,0.46,0.5,0.53,0.53,0.56,0.58,0.62,0.66,0.67,0.67,0.67,0.67,0.67,0.67,0.67,0.67,0.67,0.7,0.7,0.73,0.76,0.8,0.84,0.88,0.92,0.96,0.99,1,1,1,1,1]},
  {"name":"okaeri","src":"talk-okaeri.mp4?v=7379cb9a","dur":4.6333,"role":"greet-day","text":"おかえり。君のこと、ずっと待ってたよ。","prog":[0,0.03,0.04,0.08,0.13,0.17,0.21,0.25,0.26,0.26,0.26,0.26,0.26,0.26,0.26,0.27,0.29,0.33,0.37,0.42,0.44,0.45,0.49,0.53,0.57,0.59,0.59,0.59,0.59,0.6,0.64,0.64,0.68,0.72,0.76,0.76,0.8,0.82,0.86,0.9,0.94,0.99,1,1,1,1,1,1]},
  {"name":"oyasumi","src":"talk-oyasumi.mp4?v=df35e92a","dur":4.8,"role":"greet-night","text":"おやすみなさい。夢の中でも一緒だよ。","prog":[0,0.02,0.06,0.1,0.13,0.17,0.21,0.24,0.28,0.32,0.35,0.37,0.37,0.37,0.37,0.37,0.37,0.37,0.37,0.37,0.37,0.4,0.44,0.47,0.51,0.55,0.57,0.59,0.62,0.66,0.7,0.73,0.76,0.76,0.76,0.76,0.76,0.79,0.82,0.85,0.88,0.92,0.96,0.99,1,1,1,1,1,1]},

  const from = fresh.length ? fresh : others.length ? others : pool;
  return from[Math.floor(Math.random() * from.length)];

      b.addEventListener('click', () => replay(c)); li.append(b);
    } else {
      const p = document.createElement('p'); p.textContent = 'まだ聞いていない：' + (HINT[c.role] || ''); li.append(p);
    }
    list.append(li);
  }
  showCount(false); sheet.hidden = false; $('close').focus();
}
function closeList() { sheet.hidden = true; }
function replay(c) {                                     // 聞いた台詞を、もう一度
  closeList();
  if (busy) return;
  const name = c.role.startsWith('greet') ? 'greet' : c.role === 'closer' ? '' : c.role;
  load(c).then(() => { if (!busy) speak(c, name); }, () => {});
}
$('count').addEventListener('click', openList);
$('close').addEventListener('click', () => { closeList(); $('count').focus(); });
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeList(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) { closeList(); $('count').focus(); } });

// 始め：あいさつ → つつく → 呼ぶ の順に、最初の台詞を一つずつ受け取る。
(async () => {
  for (const name of ['greet', 'poke', 'call']) await prepare(name);
  if (closerDue()) load(closer).catch(() => {});
})();
</script>
</body>
</html>
