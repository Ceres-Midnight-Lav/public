<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スマホサイズのV</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B5D9F2">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* 色は二つ。薄い方が勿忘草色（その淡い側を背景に使う）、濃い方が #6C85D5。 */
  :root { --backdrop-top:#B5D9F2; --backdrop-bottom:#EFF7FC; --royal:#6C85D5; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--royal);
    display: grid; place-items: center; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  /* スマホ1台ぶんの縦長の枠。スマホでは画面いっぱい、広い画面では中央に1台ぶん。 */
  #frame {
    position: relative; overflow: hidden;
    height: 100vh; height: 100dvh;
    width: min(100vw, calc(100vh * 9 / 16)); width: min(100vw, calc(100dvh * 9 / 16));
    background: linear-gradient(var(--backdrop-top), var(--backdrop-bottom));
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #frame video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 30%; display: block; pointer-events: none;
  }
  #talk { opacity: 0; transition: opacity .18s linear; }
  #talk.on { opacity: 1; }
  /* 喋りの動画がある時だけ出す案内。 */
  #hint {
    position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    margin: 0; padding: 9px 16px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,.92); color: var(--royal);
    font: 500 14px/1.2 "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "Yu Gothic", system-ui, sans-serif; letter-spacing: .04em;
    opacity: 0; transition: opacity .3s linear; pointer-events: none;
  }
  #frame.can-talk:not(.spoke) #hint { opacity: 1; }
</style>
</head>
<body>
<main id="frame" aria-label="スマホサイズのV">
  <video id="idle" poster="idle.jpg?v=5b412ea9" muted autoplay loop playsinline webkit-playsinline disablepictureinpicture preload="none" aria-hidden="true"></video>
  <video id="talk" playsinline webkit-playsinline disablepictureinpicture preload="none" aria-hidden="true"></video>
  <p id="hint">タップで声が出ます</p>
</main>
<script>
// 入り口。開くと、立って、まばたきして、揺れている。押すと、声で喋る。
// 体は動画にしてある（3Dの体のデータは、このページのどこにも置いていない）。
const LOOP = 8;          // 待機の動画の1周（秒）
// 喋りの動画。src＝ファイル、dur＝長さ（秒）、role＝使い所。
//   greet-morning / greet-day / greet-night … 最初に押された時の挨拶（開いた人の時刻で一つ選ぶ）
//   tap … 二回目からの一言（順番を入れ替えながら一巡する）
//   closer … 一言を全部出し終えた後の締め
const CLIPS = [
  { src: 'talk-ohayou.mp4?v=892efd30', dur: 5.3667, role: 'greet-morning' },   // 「おはよう。今日も頑張ってね。いってらっしゃい。」
  { src: 'talk-okaeri.mp4?v=0f1c9901', dur: 4.6333, role: 'greet-day' },   // 「おかえり。君のこと、ずっと待ってたよ。」
  { src: 'talk-oyasumi.mp4?v=bba4497a', dur: 4.8, role: 'greet-night' },   // 「おやすみなさい。夢の中でも一緒だよ。」
  { src: 'talk-moshimoshi.mp4?v=e16524e6', dur: 3.6, role: 'tap' },   // 「もしもーし。聴こえてますかぁ？」
  { src: 'talk-fue.mp4?v=54008b24', dur: 7.1333, role: 'tap' },   // 「ふぇ！？びっくりした……ちゃんと、聴こえてる………かな？」
  { src: 'talk-kyuu.mp4?v=074b0364', dur: 10.7667, role: 'tap' },   // 「きゅ、急に来られたらビックリするじゃない！で、でも、来てくれてありがとう。……嬉しいよ。」
  { src: 'talk-sonnani.mp4?v=f4a910a8', dur: 9.8333, role: 'tap' },   // 「そんなに押して……暇なの？……じゃあ、もう少し一緒にいてあげる。」
  { src: 'talk-tsutsukanaide.mp4?v=719a5da9', dur: 8.1667, role: 'tap' },   // 「ちょ、ちょっと！つつかないで！……待って。もう一回。」
  { src: 'talk-ijou.mp4?v=8ddaea8c', dur: 2.5, role: 'closer' },   // 「以上っ！テストでした！」
];
const IDLE = 'idle.mp4?v=3f99dcf6';   // 待機の動画

const frame = document.getElementById('frame');
const idle = document.getElementById('idle');
const talk = document.getElementById('talk');

// 動画は丸ごと受け取ってから流す。同じサイトの別ページが置いている保存の仕組み（Service Worker）を
// 通っても、通らなくても、同じ動きになる受け取り方。
const fetchUrl = async (src) => URL.createObjectURL(await (await fetch(src)).blob());
const play = (v) => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };

(async () => {
  try { idle.src = await fetchUrl(IDLE); } catch { return; }   // 受け取れない時は、止まった絵のまま
  play(idle);                                                        // 自動で流れない設定の端末では、最初のタップで流れる
})();

// 朝（4時〜10時台）は「おはよう」、昼から夜（11時〜21時台）は「おかえり」、夜更け（22時〜3時台）は「おやすみなさい」。
const partOfDay = (h = new Date().getHours()) => (h >= 4 && h < 11 ? 'morning' : h >= 11 && h < 22 ? 'day' : 'night');
const taps = CLIPS.filter((c) => c.role === 'tap');
const closer = CLIPS.find((c) => c.role === 'closer');
let greeted = false, queue = [], closerDue = false, last = null;
function upcoming() {                                   // 次に喋る台詞を決める
  if (!greeted) { greeted = true; const g = CLIPS.find((c) => c.role === 'greet-' + partOfDay()); if (g) return g; }
  if (!queue.length) {
    if (closerDue && closer) { closerDue = false; return closer; }
    queue = taps.slice();
    for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    if (queue.length > 1 && queue[0] === last) queue.push(queue.shift());   // 続けて同じ台詞にしない
    closerDue = queue.length > 0;
  }
  return (last = queue.shift()) || null;
}

// 次の台詞は、前もって一つだけ受け取っておく（全部を先に受け取ると、開いた人の通信量が大きくなる）。
let next = null, pending = null;
const got = new Map();                                  // 受け取り済みの台詞（二巡目からは受け取り直さない）
function prepare(c) {
  next = null; pending = c;
  if (!c) return;
  const ready = (url) => { if (pending !== c) return; pending = null; next = { ...c, url }; frame.classList.add('can-talk'); };
  if (got.has(c.src)) { ready(got.get(c.src)); return; }
  fetchUrl(c.src).then((url) => { got.set(c.src, url); ready(url); },
                       () => { if (pending === c) pending = null; });   // 受け取れなかった時は、次に押された時に別の台詞を取りに行く
}
prepare(upcoming());

let busy = false, current = null;
function finish() {
  if (!busy) return;
  busy = false;
  if (!document.hidden) play(idle);
  talk.classList.remove('on');
}
frame.addEventListener('click', () => {
  if (!busy && idle.paused && idle.src) play(idle);
  if (busy) return;
  if (!next) { if (!pending) prepare(upcoming()); return; }
  current = next; busy = true;
  frame.classList.add('spoke'); frame.dataset.line = current.src;
  talk.src = current.url; talk.muted = false;
  const p = talk.play();
  if (p && p.catch) p.catch(finish);
  prepare(upcoming());                                  // 喋っている間に、次の台詞を受け取っておく
});
talk.addEventListener('playing', () => {
  talk.classList.add('on');
  // 喋り終わりの姿勢は、待機の同じ時刻の姿勢と揃えてある。喋っている間に、待機をその時刻で待たせておく。
  idle.pause();
  try { idle.currentTime = (current.dur || talk.duration || 0) % LOOP; } catch { /* そのままの位置から戻る */ }
});
talk.addEventListener('ended', finish);
talk.addEventListener('error', finish);
talk.addEventListener('pause', () => { if (!talk.ended) finish(); });   // 画面を離れて途中で止まった時
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (busy) talk.pause(); return; }
  if (!busy && idle.src) play(idle);
});
</script>
</body>
</html>
